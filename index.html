<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DME Menu Table</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      margin-top: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #2c2c2c;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #444;
      vertical-align: top;
    }
    th {
      background-color: #333;
    }
    .action-buttons button {
      margin-right: 8px;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .dc { background-color: #e74c3c; color: white; }
    .has { background-color: #3498db; color: white; }
    .lost { background-color: #f1c40f; color: black; }
    .damaged { background-color: #9b59b6; color: white; }
    .row-container {
      display: flex;
      align-items: center;
    }
    .status-bar {
      width: 4px;
      height: 100%;
      margin-right: 8px;
    }
    .info-icon {
      margin-right: 8px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 50%;
      display: inline-block;
      width: 20px;
      height: 20px;
      text-align: center;
      line-height: 20px;
      font-size: 14px;
    }
    .info-box {
      position: absolute;
      background-color: #333;
      border: 1px solid #555;
      color: white;
      padding: 10px;
      border-radius: 6px;
      max-width: 300px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h2>Order New DME</h2>
  <input type="text" id="dmeSearch" placeholder="Search for DME..." style="padding: 8px; margin-right: 10px; border-radius: 4px; border: none; width: 200px;" />
  <label style="background-color: #007bff; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
    Browse
    <input type="file" style="display: none;" id="fileUpload" />
  </label>

  <h2>DME 1</h2>
  <table id="dmeTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Stop</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="infoBox" class="info-box"></div>

  <script>
    let dmeDetails = [];

    // Load both CSVs safely
    Promise.all([
      fetch('DME_list.csv').then(res => res.text()),
      fetch('data.csv').then(res => res.text())
    ]).then(([dmeCSV, dataCSV]) => {
      dmeDetails = parseCSV(dmeCSV);
      const rows = parseCSV(dataCSV);
      populateTable(rows);
    });

    function parseCSV(data) {
      const lines = data.trim().split(/\r?\n/);
      const headers = parseCSVLine(lines[0]).map(h => h.trim());

      return lines.slice(1)
        .filter(line => line.trim() !== '')
        .map(line => {
          const values = parseCSVLine(line);
          const row = {};
          headers.forEach((header, i) => {
            row[header] = values[i]?.trim() ?? '';
          });
          return row;
        });
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];

        if (char === '"' && inQuotes && nextChar === '"') {
          current += '"';
          i++; // skip escaped quote
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current);
      return result;
    }

      if (status === 'Valid') return 'green';
      if (status === 'Needs Receipt') return 'red';
      return 'blue';
    }
