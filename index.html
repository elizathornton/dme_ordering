<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DME Menu Table</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #2c2c2c;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #444;
    }
    th {
      background-color: #333;
    }
    .action-buttons button {
      margin-right: 8px;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .dc { background-color: #e74c3c; color: white; }
    .has { background-color: #3498db; color: white; }
    .lost { background-color: #f1c40f; color: black; }
    .damaged { background-color: #9b59b6; color: white; }
  </style>
</head>
<body>
  <h2>DME Menu</h2>
  <table id="dmeTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Stop</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be inserted here by JavaScript -->
    </tbody>
  </table>

  <script>
    // Example CSV data - replace with actual fetch or upload logic
    fetch('data.csv')
      .then(response => response.text())
      .then(csvData => {
        const parsedRows = parseCSV(csvData);
        populateTable(parsedRows);
      });


    function parseCSV(data) {
      const lines = data.trim().split('\n');
      const headers = lines[0].split(',');
      const rows = lines.slice(1).map(line => line.split(','));
      return rows;
    }

    function populateTable(rows) {
      const tbody = document.querySelector('#dmeTable tbody');
      rows.forEach(row => {
        const tr = document.createElement('tr');

        row.forEach(cell => {
          const td = document.createElement('td');
          td.textContent = cell;
          tr.appendChild(td);
        });

        // Add Action buttons
        const actionTd = document.createElement('td');
        actionTd.classList.add('action-buttons');

        const buttons = [
          { class: 'dc', text: 'DC' },
          { class: 'has', text: 'Patient Has' },
          { class: 'lost', text: 'Lost Stolen' },
          { class: 'damaged', text: 'Damaged' }
        ];

        buttons.forEach(({ class: cls, text }) => {
          const btn = document.createElement('button');
          btn.className = cls;
          btn.textContent = text;
          actionTd.appendChild(btn);
        });

        tr.appendChild(actionTd);
        tbody.appendChild(tr);
      });
    }

    const parsedRows = parseCSV(csvData);
    populateTable(parsedRows);
  </script>
</body>
</html>
